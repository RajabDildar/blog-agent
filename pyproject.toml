[project]
name = "blog-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.0.1",
    "langchain>=1.3.14",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "tavily-python>=0.7.27",
    "langchain-google-genai>=4.3.3",
    "markdown-it-py[linkify]==4.2.0",
    "mdformat==1.0.0",
    "mdformat-gfm==1.0.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
    "sqlalchemy>=2.1.0",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "google-auth>=2.56.3",
    "redis>=5.0.0",
    "rq>=2.0.0", 
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg-pool>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["blog_agent*"]

